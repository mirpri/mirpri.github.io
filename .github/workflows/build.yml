name: Build Vite App

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Build Vite app
        run: yarn build

      - name: Upload production-ready build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
