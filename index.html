      body {
        background-color: #1a1b26;
        color: #c0caf5;
        overflow: hidden; /* Prevent native scroll */
      }
      /* Custom Scrollbar for non-vim feel fallback */
      .editor ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .editor ::-webkit-scrollbar-track {
        background: #1a1b26;
      }
      .editor ::-webkit-scrollbar-thumb {
        background: #3b4261;
        border-radius: 4px;
      }
      .editor ::-webkit-scrollbar-thumb:hover {
        background: #7aa2f7;
      }
      /* Remove cursor transition/blink by default */
      .cursor-block {
        animation: none;
      }
      /* Invert native selection for mouse-based selection */
      ::selection {
        background: #c0caf524;
        /* color: #16161e; */
      }
